name: Care Plan occurrence maintenance

on:
  schedule:
    # 00:17 Asia/Yangon expressed in UTC. Clinical recurrence dates remain
    # calculated by each Care Plan's own timezone in PostgreSQL.
    - cron: '17 18 * * *'

permissions:
  contents: read

concurrency:
  group: care-plan-occurrence-maintenance
  cancel-in-progress: false

jobs:
  maintain-care-plan-occurrences:
    runs-on: ubuntu-latest
    environment: care-plan-maintenance
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Extend bounded Care Plan horizons
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node supabase/scripts/run-care-plan-maintenance.mjs
